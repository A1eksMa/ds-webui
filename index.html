<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="version" content="0.10.0a1">
  <title>ds-webui</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app"><p class="muted" style="padding:1rem">Загрузка…</p></div>

  <!--
    Данные (из ds get / поллера) при file:// не забираются через fetch().
    Манифест грузится инъекцией <script> с fallback data/ -> sample-data/.
    Дальнейшие файлы источников тем же способом подгружает main.js. См. docs/contract.md
  -->
  <script>
    window.DS = { sources: {} };
    window.__ds = (function () {
      var resolve;
      var ready = new Promise(function (r) { resolve = r; });
      function tryDir(dir, isLast) {
        var s = document.createElement('script');
        s.src = dir + '/manifest.js';
        s.onload = function () {
          resolve({ dataDir: dir, manifest: window.DS_MANIFEST || null });
        };
        s.onerror = function () {
          if (isLast) resolve({ dataDir: null, manifest: null });
          else tryDir('sample-data', true);
        };
        document.head.appendChild(s);
      }
      tryDir('data', false);
      return { ready: ready };
    })();
  </script>
  <script src="presets.js"></script>
  <script src="util.js"></script>
  <script src="effects.js"></script>
  <script src="dataset.js"></script>
  <script src="entities.js"></script>
  <script src="export.js"></script>
  <script src="store.js"></script>
  <script src="view-common.js"></script>
  <script src="view-build.js"></script>
  <script src="view-table.js"></script>
  <script src="main.js"></script>
</body>
</html>
