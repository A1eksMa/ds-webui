<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="version" content="0.28.0a1">
  <title>ds-webui</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app"><p class="muted" style="padding:1rem">Загрузка…</p></div>

  <!--
    Данные (из ds get / поллера) при file:// не забираются через fetch().
    Манифест (+ опциональные фрагменты manifest.imports.js) и дальнейшие файлы
    источников грузятся инъекцией <script> — см. main.js (bootstrapManifest/
    initialBoot/loadSourceScript) и docs/contract.md. Бутстрап целиком живёт в
    main.js (грузится последним, после effects.js) — здесь только то, что нужно
    самым первым инжектируемым <script>-тегам источников: пространство имён,
    в которое они дописывают себя.
  -->
  <script>
    window.DS = { sources: {} };
  </script>
  <script src="util.js"></script>
  <script src="effects.js"></script>
  <!--
    import/ — опциональный git submodule (https://github.com/A1eksMa/ds-webui-import),
    конвертер .xlsx -> формат источника ds-webui + фрагмент манифеста. Не инициализирован
    submodule ("lite"-сборка) -> эти два файла просто не найдутся, кнопка «Импорт» на
    «Настройках» не появится (view-build.js проверяет window.DS_APP.importXlsx перед
    рендером) — страница при этом не ломается, 404 на <script> не блокирует остальные теги.
  -->
  <script src="import/vendor/xlsx.full.min.js"></script>
  <script src="import/import.js"></script>
  <script src="dataset.js"></script>
  <script src="entities.js"></script>
  <script src="export.js"></script>
  <script src="store.js"></script>
  <script src="view-common.js"></script>
  <script src="view-build.js"></script>
  <script src="view-entities.js"></script>
  <script src="view-table.js"></script>
  <script src="main.js"></script>
</body>
</html>
